[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
pin-core = { path = "crates/pin-core" }
argon2 = { version = "0.6", default-features = false, features = ["alloc", "zeroize"] }
blake3 = "1.8"
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc", "zeroize"] }
eframe = "0.37"
getrandom = "0.4"
keyring-core = "1"
apple-native-keyring-store = { version = "1", features = ["keychain"] }
windows-native-keyring-store = { version = "1", default-features = false }
dbus-secret-service-keyring-store = { version = "1", features = ["vendored", "crypto-openssl"] }
rusqlite = "0.43"
tempfile = "3.27"
thiserror = "2.0"
zeroize = "1.9"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
