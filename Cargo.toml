[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
pin-core = { path = "crates/pin-core" }
pin-clipboard = { path = "crates/pin-clipboard" }
anyhow = "1.0"
argon2 = { version = "0.6", default-features = false, features = ["alloc", "zeroize"] }
blake3 = "1.8"
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc", "zeroize"] }
directories = "6"
eframe = "0.37"
getrandom = "0.4"
global-hotkey = "0.10"
keyring-core = "1"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSBitmapImageRep", "NSImageRep", "NSPasteboard", "NSPasteboardItem", "NSRunningApplication", "NSWorkspace"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSData", "NSDictionary", "NSString"] }
apple-native-keyring-store = { version = "1", features = ["keychain"] }
windows-native-keyring-store = { version = "1", default-features = false }
dbus-secret-service-keyring-store = { version = "1", features = ["vendored", "crypto-openssl"] }
rusqlite = "0.43"
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
proptest = "1.9"
tempfile = "3.27"
thiserror = "2.0"
winit = { version = "0.30", default-features = false }
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std", "ansi"] }
zeroize = "1.9"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"
print_stderr = "warn"
allow_attributes = "warn"
redundant_clone = "warn"
mem_forget = "warn"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
