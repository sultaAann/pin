[package]
name = "pin-core"
description = "Clipboard history storage, encryption and search"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
blake3.workspace = true
thiserror.workspace = true
zeroize.workspace = true

# macOS builds SQLCipher against CommonCrypto; other targets have no system crypto SQLCipher can rely on, so OpenSSL is vendored.
[target.'cfg(target_os = "macos")'.dependencies]
rusqlite = { workspace = true, features = ["bundled-sqlcipher", "functions"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
rusqlite = { workspace = true, features = ["bundled-sqlcipher-vendored-openssl", "functions"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
