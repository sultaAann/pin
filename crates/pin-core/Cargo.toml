[package]
name = "pin-core"
description = "Clipboard history storage, encryption and search"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
argon2.workspace = true
blake3.workspace = true
chacha20poly1305.workspace = true
directories.workspace = true
getrandom.workspace = true
keyring-core.workspace = true
thiserror.workspace = true
tracing.workspace = true
zeroize.workspace = true

# macOS builds SQLCipher against CommonCrypto; other targets have no system crypto SQLCipher can rely on, so OpenSSL is vendored.
[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store.workspace = true
rusqlite = { workspace = true, features = ["bundled-sqlcipher", "functions"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
rusqlite = { workspace = true, features = ["bundled-sqlcipher-vendored-openssl", "functions"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store.workspace = true

# The synchronous libdbus store avoids the async runtime threads zbus keeps alive in an always-running app.
[target.'cfg(any(target_os = "linux", target_os = "freebsd", target_os = "openbsd", target_os = "netbsd", target_os = "dragonfly"))'.dependencies]
dbus-secret-service-keyring-store.workspace = true

[dev-dependencies]
criterion.workspace = true
proptest.workspace = true
tempfile.workspace = true

[[bench]]
name = "search"
harness = false

[lints]
workspace = true
